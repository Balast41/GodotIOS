name: "Build iOS app"

# on: [push]
on: [workflow_dispatch]

jobs:
  build_ios:
    runs-on: macos-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build archive and ipaify
        run: |
          wget -O archive.zip "https://www.dropbox.com/scl/fi/dri8prm918r8rae8grinv/a5024a79-c1b8-11f1-9b7c-a029422857c0.zip?rlkey=jpai3d2q9a0aysrbl9jaeftqy&dl=1"
          unzip archive.zip -d .

          xcodebuild archive -project Quiz.xcodeproj -scheme 'Quiz' -archivePath Quiz.xcarchive -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

          mkdir Payload
          mv Quiz.xcarchive/Products/Applications/Quiz.app Payload/Quiz.app

          zip -r "Quiz.ipa" "Payload"

          mv Quiz.ipa ${{ runner.temp }}/Quiz.ipa


      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: Quiz
          path: ${{ runner.temp }}/Quiz.ipa
          # you can also archive the entire directory
          # path: ${{ runner.temp }}/build
          retention-days: 3